<title>First Light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:wght@400;600&display=swap">
<style>
/* Layout: a tinted page per section, one reading card with a colour band and icon, five-tab bar fixed at the bottom. */
:root {
  --surface: #FFFFFF;
  --fg: #16222C;
  --muted: #566572;
  --line: #D3DCE3;
  --bg: #FFF9EC;
  --accent: #8A5700;
  --accent-soft: #FBEFD0;
  --on-accent: #FFFFFF;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --verse-a: #8A5700; --verse-s: #FBEFD0; --verse-bg: #FFF9EC; --verse-on: #FFFFFF;
    --inspire-a: #B02E43; --inspire-s: #FBE1E5; --inspire-bg: #FFF5F6; --inspire-on: #FFFFFF;
    --facts-a: #0A6F6A; --facts-s: #D6F1EE; --facts-bg: #F1FBFA; --facts-on: #FFFFFF;
    --learn-a: #3A7220; --learn-s: #E0F2D5; --learn-bg: #F5FBF0; --learn-on: #FFFFFF;
    --saved-a: #35577F; --saved-s: #DFE8F3; --saved-bg: #F2F6FB; --saved-on: #FFFFFF;
    --ask-a: #6B3FA0; --ask-s: #ECE2F7; --ask-bg: #F8F4FC; --ask-on: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #172230; --fg: #E8EEF3; --muted: #9AA9B6; --line: #263545;
    --verse-a: #F0C05A; --verse-s: #3A2E12; --verse-bg: #17130B; --verse-on: #1A1300;
    --inspire-a: #F59AA6; --inspire-s: #40202A; --inspire-bg: #1A1015; --inspire-on: #2A0B12;
    --facts-a: #52D6CA; --facts-s: #123533; --facts-bg: #0C1818; --facts-on: #04211F;
    --learn-a: #9AD875; --learn-s: #21361A; --learn-bg: #101709; --learn-on: #0F2406;
    --saved-a: #8DB4E2; --saved-s: #1F2F43; --saved-bg: #0E1620; --saved-on: #08182B;
    --ask-a: #C3A3EE; --ask-s: #2E2340; --ask-bg: #130F1A; --ask-on: #1C0F30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #172230; --fg: #E8EEF3; --muted: #9AA9B6; --line: #263545;
  --verse-a: #F0C05A; --verse-s: #3A2E12; --verse-bg: #17130B; --verse-on: #1A1300;
    --inspire-a: #F59AA6; --inspire-s: #40202A; --inspire-bg: #1A1015; --inspire-on: #2A0B12;
    --facts-a: #52D6CA; --facts-s: #123533; --facts-bg: #0C1818; --facts-on: #04211F;
    --learn-a: #9AD875; --learn-s: #21361A; --learn-bg: #101709; --learn-on: #0F2406;
    --saved-a: #8DB4E2; --saved-s: #1F2F43; --saved-bg: #0E1620; --saved-on: #08182B;
    --ask-a: #C3A3EE; --ask-s: #2E2340; --ask-bg: #130F1A; --ask-on: #1C0F30;
  color-scheme: dark;
}
[data-sec="verse"]   { --accent: var(--verse-a);   --accent-soft: var(--verse-s);   --on-accent: var(--verse-on);   --bg: var(--verse-bg); }
[data-sec="inspire"] { --accent: var(--inspire-a); --accent-soft: var(--inspire-s); --on-accent: var(--inspire-on); --bg: var(--inspire-bg); }
[data-sec="facts"]   { --accent: var(--facts-a);   --accent-soft: var(--facts-s);   --on-accent: var(--facts-on);   --bg: var(--facts-bg); }
[data-sec="learn"]   { --accent: var(--learn-a);   --accent-soft: var(--learn-s);   --on-accent: var(--learn-on);   --bg: var(--learn-bg); }
[data-sec="saved"]   { --accent: var(--saved-a);   --accent-soft: var(--saved-s);   --on-accent: var(--saved-on);   --bg: var(--saved-bg); }
[data-sec="ask"]     { --accent: var(--ask-a);     --accent-soft: var(--ask-s);     --on-accent: var(--ask-on);     --bg: var(--ask-bg); }
* { box-sizing: border-box; }
body {
  background: linear-gradient(180deg, var(--accent-soft) 0, var(--bg) 300px) no-repeat, var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 1.25rem 7rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 38rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header h1 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; margin: 0; line-height: 1.2; color: var(--accent); }
header p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.9rem; }

.daynav { display: flex; align-items: center; gap: 0.75rem; }
.daynav .when { flex: 1; min-width: 0; text-align: center; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.daynav .when strong { display: block; font-weight: 600; }
.daynav .when span { color: var(--muted); font-size: 0.85rem; }
.step {
  width: 2.75rem; height: 2.75rem; border-radius: 50%;
  border: 1px solid var(--accent-soft); background: var(--accent-soft); color: var(--accent);
  font-size: 1.25rem; line-height: 1; flex: none;
}
.step:disabled { opacity: 0.35; cursor: default; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 0 0 1.5rem; overflow: hidden; }
.card > :not(.kicker) { margin-left: 1.35rem; margin-right: 1.35rem; }
.kicker { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 0.85rem 1.35rem; margin: 0 0 1.25rem; }
.kicker-icon { width: 1.5rem; height: 1.5rem; flex: none; }
.kicker-icon, .tab-icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.3; margin: 0 0 0.6rem; text-wrap: balance; }
.body { font-family: var(--display); font-size: clamp(1.2rem, 4.6vw, 1.5rem); line-height: 1.55; margin: 0; }
.body.plain { font-family: var(--ui); font-size: 1.1rem; line-height: 1.6; }
.try { margin: 1.1rem 0 0; padding: 0.85rem 1rem; border-radius: 10px; background: var(--accent-soft); font-size: 0.98rem; }
.try b { font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.4rem; }
.btn {
  min-height: 2.75rem; padding: 0.4rem 0.85rem; border-radius: 999px;
  border: 1px solid var(--accent); background: transparent; color: var(--accent); font-size: 0.95rem; font-weight: 500;
}
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.saved-head { display: flex; justify-content: space-between; align-items: baseline; }
.saved-head h2 { font-family: var(--display); font-size: 1.35rem; margin: 0; }
.saved-head span { color: var(--muted); font-size: 0.9rem; }
.saved-list { display: flex; flex-direction: column; gap: 0.9rem; }
.saved-list .card { padding: 0 0 1.1rem; }
.saved-list .body { font-size: 1.05rem; }
.empty { color: var(--muted); text-align: center; padding: 2.5rem 1rem; border: 1px dashed var(--line); border-radius: 16px; margin: 0; }

footer { color: var(--muted); font-size: 0.8rem; text-align: center; padding-top: 0.5rem; }
.source { color: var(--muted); font-size: 0.8rem; margin: 1rem 0 0; }
.sheetnote { text-align: center; }
.sheetnote .source { margin: 0; }

nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0.25rem max(8px, env(safe-area-inset-left, 0px)) calc(0.25rem + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
}
nav .tabs { max-width: 38rem; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab {
  background: none; border: 0; border-top: 3px solid transparent; border-radius: 0;
  min-height: 3.6rem; padding: 0.35rem 0.1rem; font-size: 0.74rem; font-weight: 500; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
}
.tab-icon { width: 1.4rem; height: 1.4rem; color: var(--accent); opacity: 0.7; }
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); font-weight: 600; }
.tab[aria-current="page"] .tab-icon { opacity: 1; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--fg); color: var(--bg); padding: 0.55rem 1rem; border-radius: 999px; font-size: 0.9rem;
  max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise 0.25s ease-out; }
  @keyframes rise { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
.install{margin-top:0.75rem}
header h1{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
footer .credit{display:block;margin-top:0.35rem;font-weight:600;color:var(--accent)}

/* Ask me anything */
.ask-intro { color: var(--muted); font-size: 0.95rem; margin: 0; }
.chat { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1.1rem; }
.msg { margin: 0; max-width: 88%; padding: 0.7rem 0.95rem; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1rem; line-height: 1.5; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 5px; }
.msg.bot { align-self: flex-start; background: var(--accent-soft); color: var(--fg); border-bottom-left-radius: 5px; }
.msg.err { align-self: flex-start; background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.msg.wait { align-self: flex-start; background: var(--accent-soft); color: var(--muted); font-style: italic; }
.ask-form { display: flex; gap: 0.5rem; align-items: flex-end; margin-top: 1.1rem; }
.ask-form textarea { flex: 1; min-width: 0; min-height: 2.9rem; max-height: 9rem; resize: none; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0.65rem 0.8rem; }
.ask-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.ask-form .btn { flex: none; }

  ["The 20-20-20 Rule", `Screens strain your eyes. Every 20 minutes, look at something about 20 feet (6 meters) away for 20 seconds.`, `Set a repeating timer on your phone for 20 minutes.`],
  ["The Rule of 72", `To estimate how long money takes to double, divide 72 by the yearly interest rate. At 6% it takes about 12 years. At 9%, about 8 years.`, `Try it with a rate you have seen on a savings account.`],
  ["Pomodoro Focus", `Work with full attention for 25 minutes, then rest for 5. After four rounds, take a longer break of 15 to 30 minutes.`, `Run one 25-minute round on your most important task.`],
  ["Active Listening", `Before you answer, repeat back what you heard in your own words: "So you're saying..." People feel understood, and you catch mistakes early.`, `Do it once in your next conversation.`],
  ["Multiply by 11", `For a two-digit number, add its digits and put the sum in the middle. 23 × 11: 2 + 3 = 5, so the answer is 253. If the sum is 10 or more, carry the 1 to the left digit.`, `Try 45 × 11 (answer: 495), then 78 × 11 (answer: 858).`],
  ["Know Your Emergency Number", `Emergency numbers differ by country: 112 in Kuwait and across the EU, 911 in the United States and Canada, 999 in the United Kingdom.`, `Save the right number for where you live in your phone's favorites.`],
  ["The 50/30/20 Budget", `A simple way to split income after tax: 50% for needs like rent and food, 30% for wants, and 20% for savings or paying off debt.`, `Sort last month's spending into those three groups and see where you land.`],
  ["Cool a Burn", `For a minor burn, cool the skin under cool running water for 10 to 20 minutes. Do not use ice, butter or toothpaste. See a doctor for large, deep or facial burns.`, `Find the cold tap in your kitchen now so you know how to reach it fast.`],
  ["Memorize a Verse", `Read it aloud three times. Write it out once. Then cover a few words, say it again, and cover a few more each round until you can say it all.`, `Try it with today's verse.`],
  ["Roman Numerals", `The seven symbols are I = 1, V = 5, X = 10, L = 50, C = 100, D = 500 and M = 1000. A smaller symbol before a larger one is subtracted, so IV is 4 and IX is 9.`, `Write this year in Roman numerals.`],
  ["Find North at Night", `In the Northern Hemisphere, find the Big Dipper and follow the line from the two stars at the end of its bowl. It points to Polaris, the North Star.`, `Look up tonight if the sky is clear.`],
  ["The 80/20 Idea", `Often about 80% of your results come from about 20% of your effort. It is a rule of thumb, not a law, but it is a good prompt to ask what really matters.`, `List your tasks for today and circle the two that matter most.`],
  ["Touch Typing", `Rest your fingers on A S D F and J K L ; with your thumbs on the space bar. Return to that home row after every key. Accuracy first, speed later.`, `Practice for five minutes without looking at the keys.`],
  ["Memory Palace", `Picture a route you know well, like walking through your home. Place each thing you want to remember at a spot along the route with a vivid image, then walk the route in your mind to recall them.`, `Memorize a shopping list of five items this way.`],
  ["Check a Source", `Before you share something online, ask who wrote it, when, what evidence it gives, and whether anyone reliable reports the same thing.`, `Check one claim you saw today with a second source.`],
  ["Add Up a Column", `In a spreadsheet, type =SUM(A1:A10) in any empty cell to add the numbers in cells A1 through A10. Change the letters and numbers to match your data.`, `Try it with a short list of your expenses.`],
  ["Say No Kindly", `You can decline without a long excuse: "Thank you for asking. I can't take that on right now." A clear, warm no is kinder than a yes you will resent.`, `Practice the sentence once out loud.`],
  ["Steady Wake-Up Time", `Waking at about the same time every day, even on days off, helps your body clock more than most sleep tricks.`, `Choose a wake-up time you can keep all week.`],
  ["The Reef Knot", `To join two ropes: cross the right end over the left and tuck it under, then cross the left end over the right and tuck it under. Right over left, left over right.`, `Practice with two shoelaces.`],
  ["Write a Thank-You Note", `A short, specific thank-you means more than a long general one. Name what the person did and what difference it made.`, `Write two sentences to someone who helped you recently.`],
  ["Read the Label", `On packaged food, check the serving size first. Then look at sugar, salt (sodium) and the ingredient list, where the first item is the largest.`, `Read the label of something in your kitchen.`],
  ["Walk and Think", `Walking, even for ten minutes, tends to make thinking and mood a little better. It is a free reset when you feel stuck.`, `Take a ten-minute walk with your phone in your pocket.`],
  ["Name the Feeling", `Putting a name on an emotion, like "I feel anxious" or "I feel overlooked", can make it easier to handle. Naming it creates a little distance.`, `Name what you feel right now in one word.`],
  ["Read Aloud", `Reading aloud helps you spot clumsy sentences, catch mistakes and remember what you read.`, `Read your next email out loud before you send it.`],
  ["Decide with Two Lists", `For a hard choice, list what you gain and what you risk with each option. Then ask what you would advise a friend in the same spot.`, `Try it on one small decision today.`],
  ["Remember Names", `When you meet someone, repeat their name straight away and use it once or twice in the conversation. It sticks far better.`, `Use someone's name in your next conversation.`],
  ["Stand Up Each Hour", `Sitting for long stretches is hard on your body. Stand, stretch or walk for a minute every hour.`, `Set an hourly reminder for the rest of today.`],
  ["How to Apologize", `A good apology names what you did, says you are sorry for its effect, and says what you will do differently. It does not add "but".`, `Rehearse one in your head for something you have been avoiding.`],
  ["Quick Percentages", `To find 10% of a number, move the decimal point one place to the left. For 20%, double that. For 15%, add 10% and half of 10%.`, `Work out a 15% tip on 40 (answer: 6).`],
  ["Keyboard Shortcuts", `Ctrl+C copies, Ctrl+V pastes, Ctrl+Z undoes and Ctrl+F finds words on a page. On a Mac, use Cmd instead of Ctrl.`, `Use Ctrl+F (or Cmd+F) to find a word on a page today.`],
  ["Strong Passwords", `A long phrase of several random words is stronger and easier to remember than a short, complicated password. Use a different one for each important account. A password manager can help.`, `Change your email password if you use it anywhere else.`],
  ["Spot a Scam Message", `Scams create urgency, ask for codes or money, and use odd links. A real bank will not ask for your PIN or a one-time code by message or phone call.`, `Do not tap links in unexpected messages. Open the official app or website yourself.`],
  ["Time Zone Math", `Kuwait is 3 hours ahead of UTC and does not change its clocks. To find the time elsewhere, add or subtract that place's difference from UTC.`, `Work out the time in London in winter, when it matches UTC.`],
  ["Mixing Colors", `Red, yellow and blue make most other colors. Red and yellow make orange, yellow and blue make green, and blue and red make purple.`, `Try it with any paints, crayons or markers you have.`],
  ["Why We Have Seasons", `Seasons happen because Earth is tilted, not because it moves closer to or farther from the Sun. When your half of the world tilts toward the Sun, it is summer.`, `Explain it to someone this week.`],
  ["Hello in Five Languages", `Hola (Spanish), Bonjour (French), Habari (Swahili), Namaste (Hindi) and Sannu (Hausa).`, `Greet someone with one of them today.`],
  ["Give Good Feedback", `Be specific and kind. Say what worked, what to change and why. Talk about the work, not the person.`, `Give one specific compliment today.`],
  ["A To-Do List That Works", `Write the next physical action for each task, like "Call the dentist", instead of a vague goal like "Health". Keep your priorities for the day to three.`, `Write your three for today.`],
  ["Drink Water in the Heat", `In hot weather, do not wait until you are very thirsty. Sip water regularly through the day, especially when you are outside.`, `Keep a bottle of water within reach today.`],
  ["The Planets in Order", `Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. A sentence helps: My Very Educated Mother Just Served Us Nachos.`, `Say them in order without looking.`],
  ["Compare by Unit Price", `Check the price per 100 grams or per liter on the shelf label. The bigger pack is not always the better deal.`, `Compare two similar products next time you shop.`],
  ["Better Notes", `Write notes in your own words instead of copying word for word, and add one line at the end that sums up the main idea.`, `Sum up this lesson in one line.`],
  ["Set a Scroll Limit", `Decide how long you will spend before you open a social app, and set a timer. Deciding first beats trying to stop later.`, `Set a 15-minute timer next time you open one.`],
  ["Test Your Smoke Alarm", `Smoke alarms save lives, but only when they work. Press the test button once a month and replace the batteries when they run low.`, `Test the alarm in your home this week.`],
  ["Three-Line Journal", `Each evening, write three lines: what happened, what you learned, and what you are thankful for.`, `Write your three lines tonight.`],
  ["Subject and Verb", `Every complete sentence needs a subject (who or what) and a verb (the action). "Birds sing" is a complete sentence.`, `Find the subject and verb in the next sentence you read.`],
  ["Celsius to Fahrenheit", `For a rough answer, double the Celsius number and add 30. The exact way is to multiply by 1.8 and add 32. At 25°C, the rough answer is 80°F and the exact one is 77°F.`, `Convert 30°C both ways.`],
  ["Speak with Pauses", `When you speak to a group, pause instead of filling gaps with "um". Slow down and look at one person at a time.`, `Practice a 30-second introduction of yourself with two pauses.`],
  ["Ask Open Questions", `Questions that begin with "what" or "how" get fuller answers than questions that can be answered with yes or no.`, `Ask one open question in your next conversation.`]
];

function dateKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function mod(n, m) { return ((n % m) + m) % m; }
function dayDate(off) { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate() + off); }
function dayNumber(d) { return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
var START = dayNumber(new Date(2026, 10, 24));
function minOffset() { return START - dayNumber(dayDate(0)); }

function keyOf(d) {
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function cell(row, i) { var v = row && row[i]; return typeof v === "string" ? v.trim() : ""; }
function sheetItem(sec, row) {
  var a, b;
  if (sec === "verse") { a = cell(row, 1); b = cell(row, 2); return a && b ? [a, b] : null; }
  if (sec === "inspire") { a = cell(row, 3); b = cell(row, 4); return a && b ? [a, b] : null; }
  if (sec === "facts") { a = cell(row, 5); b = cell(row, 6); return a && b ? [a, b] : null; }
  if (sec === "learn") { a = cell(row, 7); b = cell(row, 8); return a && b ? [a, b, cell(row, 9)] : null; }
  return null;
}
function currentItem(sec, off) {
  var key = keyOf(dayDate(off));
  var row = sheetRows[key];
  if (row) {
    var it = sheetItem(sec, row);
    if (it) return { id: "sheet:" + sec + ":" + key, item: it };
  }
  var idx = pickIndex(sec, off);
  return { id: sec + ":" + idx, item: SECTIONS[sec].items[idx] };
}

function sheetDateKey(s) {
  if (s == null) return "";
  s = String(s).trim();
  var m = /^Date\((\d+),(\d+),(\d+)/.exec(s);
  if (m) return keyOf(new Date(+m[1], +m[2], +m[3]));
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if (m) return keyOf(new Date(+m[1], +m[2] - 1, +m[3]));
  return "";
}
function applySheet(rows) {

    if (JSON.stringify(sheetRows[k]) !== JSON.stringify(rows[k])) { sheetRows[k] = rows[k]; changed = true; }
  });
  return changed;
}
function parseSheet(text) {
  var start = text.indexOf("("), end = text.lastIndexOf(")");
  if (start < 0 || end <= start) return null;
  var data = JSON.parse(text.slice(start + 1, end));
  if (!data || !data.table || !data.table.rows) return null;
  var out = {};
  data.table.rows.forEach(function (r) {
    var c = r.c || [];
    var key = sheetDateKey(c[0] && c[0].v) || sheetDateKey(c[0] && c[0].f);
    if (!key) return;
    var row = [key];
    for (var i = 1; i < 10; i++) {
      var x = c[i];
      row.push(x && x.v != null ? String(x.f != null ? x.f : x.v) : "");
    }
    out[key] = row;
  });
  return out;
}
function loadSheet() {

function toggleSpeak(id, text, urls) {
  if (speakingId === id) { stopSpeech(); render(); return; }
  stopSpeech();
  speakingId = id;
  function done() { if (speakingId === id) { speakingId = null; currentAudio = null; render(); } }
  function speakNow() {
    if (!canSpeak) { done(); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.92;
    u.onend = done;
    u.onerror = done;
    setTimeout(function () {
      if (speakingId !== id) return;
      try { window.speechSynthesis.speak(u); } catch (e) { done(); }
    }, 150);
  }
  var list = (urls || []).slice();
  function tryNext() {
    if (speakingId !== id) return;
    var url = list.shift();
    if (!url) { currentAudio = null; speakNow(); return; }
    var a = new Audio(url);
    currentAudio = a;
    a.onended = done;
    function fail() { if (speakingId === id && currentAudio === a) { currentAudio = null; tryNext(); } }
    a.onerror = fail;
    var pr = a.play();
    if (pr && pr.catch) pr.catch(fail);
  }
  tryNext();
  render();
}

function copyText(text) {

      document.body.appendChild(ta); ta.select();

  if (navigator.clipboard && navigator.clipboard.writeText) {

// Ask me anything: questions go to the First Light Worker on Cloudflare (free Workers AI).
var ASK_URL = "https://first-light-ask.iniobongobot961.workers.dev";

var askDraft = "";
var askBusy = false;

function persistAsk() {
  askLog = askLog.slice(-30);
  try { localStorage.setItem("fl-ask", JSON.stringify(askLog)); } catch (e) {}
}

// Today's cards, sent with each question so the helper knows "today's verse" etc.
function todayContext() {
  var out = { date: keyOf(dayDate(0)) };
  ["verse", "inspire", "facts", "learn"].forEach(function (sec) {
    try { out[sec] = plainText(sec, currentItem(sec, 0).item); } catch (e) {}
  });
  return out;
}

function sendAsk(q) {
  q = (q || "").trim();
  if (!q || askBusy) return;
  if (q.length > 500) { toast("Please keep your question under 500 characters."); return; }
  askLog.push({ who: "me", text: q });
  askDraft = "";
  askBusy = true;
  persistAsk();
  render();
  if (typeof fetch !== "function" || navigator.onLine === false) {
    askBusy = false;
    askLog.push({ who: "err", text: "You seem to be offline. Connect to the internet and try again." });
    persistAsk(); render(); return;
  }
  fetch(ASK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q, today: todayContext() })
  })
    .then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (data) {
      if (data && data.answer) askLog.push({ who: "bot", text: String(data.answer).trim() });
      else askLog.push({ who: "err", text: (data && data.error) || "Sorry, no answer came back. Please try again later." });
    })
    .catch(function () {
      askLog.push({ who: "err", text: "Sorry, I couldn't reach the helper right now. Please try again later." });
    })
    .then(function () {
      askBusy = false;
      persistAsk();
      if (tab === "ask") { render(); scrollAskToEnd(); }
    });
}

  setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 30);

  ta.placeholder = "Type your question";

  when.textContent = "";
  when.appendChild(el("strong", null, label));
  when.appendChild(el("span", null, d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" })));
  document.getElementById("next").disabled = offset >= maxOffset();
  document.getElementById("prev").disabled = offset <= Math.max(-365, minOffset());
}

function render() {
  document.body.setAttribute("data-sec", tab);
  var view = document.getElementById("view");
  view.textContent = "";
  var shown = null;
  if (tab === "saved") renderSaved(view);
  else if (tab === "ask") renderAsk(view);
  else { shown = currentItem(tab, offset); view.appendChild(renderCard(tab, shown)); }
  if (speakingId && (!shown || shown.id !== speakingId)) stopSpeech();
  renderTabs();
  renderDayNav();
}

document.getElementById("prev").addEventListener("click", function () { offset -= 1; render(); });
document.getElementById("next").addEventListener("click", function () { if (offset < maxOffset()) { offset += 1; render(); } });

// Turn preview on or off: tap the title 5 times, or press and hold it for 2 seconds.
var titleTaps = 0, titleTimer, holdTimer;
var titleEl = document.querySelector("header h1");
titleEl.addEventListener("contextmenu", function (e) { e.preventDefault(); });
titleEl.addEventListener("pointerdown", function () {
  clearTimeout(holdTimer);
  holdTimer = setTimeout(function () { titleTaps = 0; togglePreview(); }, 2000);
  titleTaps += 1;
  clearTimeout(titleTimer);
  titleTimer = setTimeout(function () { titleTaps = 0; }, 2500);
  if (titleTaps >= 5) { titleTaps = 0; clearTimeout(holdTimer); togglePreview(); }
});
["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
  titleEl.addEventListener(ev, function () { clearTimeout(holdTimer); });
});
function togglePreview() {
  preview = !preview;
  try { localStorage.setItem("fl-preview", preview ? "1" : "0"); } catch (e) {}
  if (!preview && offset > 0) offset = 0;
  toast(preview ? "Preview on: tap \u203a to see tomorrow" : "Preview off");
  loadSheet();
  render();
}

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState !== "visible") return;
  var k = dateKey(new Date());
  if (k !== todayKey) { todayKey = k; offset = 0; render(); }
  if (preview || Date.now() - lastSheetFetch > 5 * 60 * 1000) loadSheet();
});

render();
loadSheet();

(function () {
  var sp = document.getElementById("splash");
  if (!sp) return;
  var closed = false;
  function close() {
    if (closed) return; closed = true;
    sp.classList.add("gone");
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 500);
  }
  sp.addEventListener("click", close);
  setTimeout(close, 1600);
})();


var deferredInstall = null;
var installBtn = document.getElementById("install");
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); deferredInstall = e; installBtn.hidden = false;
});
installBtn.addEventListener("click", function () {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(function () { deferredInstall = null; installBtn.hidden = true; });
});
window.addEventListener("appinstalled", function () { installBtn.hidden = true; });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
